<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">RIFF<span>STORE</span></div>
    <div class="auth-sub">🎸 Equipamentos de Guitarra & Rock</div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="seu@email.com" />
    </div>

    <div class="input-group">
      <label>Senha</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <button (click)="login()">Entrar</button>

    <div class="auth-toggle">
      Não tem conta? <a routerLink="/register">Cadastre-se</a>
    </div>
  </div>
</div>
